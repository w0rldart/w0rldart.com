name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "_posts/**"
      - "_layouts/**"
      - "_includes/**"
      - "_sass/**"
      - "_config.yml"
      - "assets/**"
      - "*.html"
      - "Gemfile"
      - "Gemfile.lock"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - run: bundle exec jekyll build

      - run: touch ./_site/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
